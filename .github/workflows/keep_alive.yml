name: Keep Streamlit App Alive

on:
  schedule:
    # 毎日UTC時間の0時（日本時間の午前9時）に自動実行します
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動でテスト実行するための設定

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        # あなたのアプリのURLにアクセス（curl）してスリープを防ぎます
        run: curl -s https://jbjjfapp-8ui79uvyqy8aoit5omq65z.streamlit.app/ > /dev/null