name: Keep Streamlit App Alive

on:
  schedule:
    # 6時間ごとに実行（JST: 3時・9時・15時・21時）
    - cron: '0 18,0,6,12 * * *'
  workflow_dispatch: # 手動でテスト実行するための設定

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        # あなたのアプリのURLにアクセス（curl）してスリープを防ぎます
        run: curl -s https://jbjjfapp-8ui79uvyqy8aoit5omq65z.streamlit.app/ > /dev/null